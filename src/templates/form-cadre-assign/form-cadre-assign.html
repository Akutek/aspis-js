<form class="aspis-form aspis-form--inline" method="post" action="{{action}}" data-form-root>
    <p class="aspis-form__message is-hidden" data-target="form-message"></p>
    <input type="hidden" name="_csrf" value="{{csrf}}">
    <input type="hidden" name="signup_id" value="{{signupId}}">
    <label class="aspis-form__field">
        Status
        <select name="status">
            <option value="signed_up">im Kader</option>
            <option value="benched">Bank</option>
            <option value="declined">abgelehnt</option>
            <option value="tentative">unsicher</option>
        </select>
    </label>
    <label class="aspis-form__field">
        Rolle
        <select name="raid_role">
            <option value="none">offen</option>
            <option value="tank">Tank</option>
            <option value="heal">Heal</option>
            <option value="dps">DPS</option>
        </select>
    </label>
    <button type="submit">{{submitLabel}}</button>
</form>
