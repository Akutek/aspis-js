<template id="modalShell" data-config='{"name":"modalShell","role":"leaf"}'>
<div data-modal-root role="dialog" aria-modal="true" aria-hidden="{{ariaHidden}}">
    <div data-target="backdrop"></div>
    <div data-target="dialog">
        <button type="button" data-target="close" aria-label="Schließen">×</button>
        <h2 data-target="title">{{title}}</h2>
        <div data-target="body">{{message}}</div>
    </div>
</div>
</template>
