<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aspis App</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: #f7f5f1;
            color: #1a1a1a;
        }
        main { max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem; }
        [data-accordion-item] { border: 1px solid #d6d6d6; margin-bottom: 0.5rem; background: #fff; }
        [data-accordion-item] [data-target="trigger"] {
            display: block; width: 100%; text-align: left;
            padding: 0.75rem 1rem; background: #fff; border: 0; cursor: pointer; font: inherit;
        }
        [data-accordion-item] [data-target="panel"] { padding: 0 1rem 1rem; }
        [data-accordion-item] [data-target="panel"].is-hidden,
        .is-hidden { display: none !important; }
    </style>
</head>
<body>
    <main>
        <h1>Aspis</h1>
        <p>Ein Accordion aus dem Plan-Manifest. Weitere Knoten: <code>data-controller</code>.</p>
        <div data-controller="accordion" data-slice-key="features.accordionFeature" data-single-open="true">
            <div data-accordion-item data-id="welcome">
                <button type="button" data-target="trigger">Start</button>
                <div data-target="panel">Die Runtime läuft. Manifeste liegen im Paket aspis-js.</div>
            </div>
        </div>
    </main>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
