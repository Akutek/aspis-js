<form class="aspis-form aspis-form--filter" method="get" action="{{action}}" data-form-root>
    <label class="aspis-form__field">
        Suche
        <input type="search" name="q" value="{{q}}">
    </label>
    <label class="aspis-form__field">
        Fraktion
        <select name="faction">
            <option value="" {{factionAll}}>alle</option>
            <option value="alliance" {{factionAlliance}}>Allianz</option>
            <option value="horde" {{factionHorde}}>Horde</option>
            <option value="neutral" {{factionNeutral}}>Neutral</option>
        </select>
    </label>
    <button type="submit">Filtern</button>
</form>
