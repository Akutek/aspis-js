<template id="dropdownLayout" data-config='{"name":"dropdownLayout","role":"root","isRoot":true,"slots":{"slotOptions":"{{slotOptions}}"}}'>
<div data-dropdown-root>
    <span data-target="trigger"><span data-target="label">{{selectedLabel}}</span></span>
    <ul data-target="list">
        {{slotOptions}}
    </ul>
</div>
</template>
